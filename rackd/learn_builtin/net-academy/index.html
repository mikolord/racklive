after{content:"";display:block;height:100%;width:var(--pct);background:linear-gradient(90deg,var(--orange),var(--green));border-radius:inherit;transition:.25s}.tip{font-size:12px;color:var(--muted);margin:11px 0 0;line-height:1.45}.result{padding:18px;margin-top:14px;border-color:#2d7356;display:none}.result.on{display:block}.result b{display:block;color:var(--green);font-size:17px;margin-bottom:5px}.result p{color:var(--muted);font-size:13px;line-height:1.45;margin:0}.install{position:fixed;inset:auto 16px calc(16px + env(safe-area-inset-bottom));max-width:728px;margin:auto;left:0;right:0;background:#eaf6ff;color:#07131d;border-radius:18px;padding:13px 15px;display:none;align-items:center;gap:11px;box-shadow:0 12px 45px #0007;font-size:13px}.install.on{display:flex}.install b{font-size:13px}.install button{margin-left:auto;background:#0d6ebc;color:white;border-radius:10px;padding:8px 11px;font-weight:700}.install .x{background:transparent;color:#34444f;padding:5px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#eaf6ff;color:#101820;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1;transform:translateX(-50%)}@media (prefers-color-scheme:light){:root{--bg:#f3f7fa;--surface:#fff;--surface2:#f4f8fb;--line:#d9e3eb;--text:#12202c;--muted:#647584}.hero,.lesson,.mission,.card,.result{background:linear-gradient(145deg,#fff,#eef4f7)}.room{background:linear-gradient(135deg,#e2eef5,#f8fcff)}}
