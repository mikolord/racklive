<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>showcase</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; color: #f5f5f7;
    background: radial-gradient(1200px 700px at 12% -10%, rgba(10,132,255,.42), transparent 60%),
                radial-gradient(1000px 650px at 105% 20%, rgba(191,90,242,.32), transparent 60%),
                radial-gradient(900px 600px at 50% 120%, rgba(48,209,88,.20), transparent 60%), #05060a; }
  .stage.light { color: #1c1c1e; background: radial-gradient(1200px 700px at 10% -10%, rgba(10,132,255,.25), transparent 60%),
                radial-gradient(1000px 650px at 105% 20%, rgba(191,90,242,.18), transparent 60%), #eef0f6; }
  .grid { position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0) 0 0/28px 28px; }
  .light .grid { background: radial-gradient(circle at 1px 1px, rgba(0,0,0,.06) 1px, transparent 0) 0 0/28px 28px; }

  /* macOS window: traffic lights, centred address pill, soft shadow and a hairline edge */
  .win { position: absolute; border-radius: 14px; overflow: hidden; background: #111;
    box-shadow: 0 60px 130px rgba(0,0,0,.6), 0 18px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.08); }
  .light .win { box-shadow: 0 50px 110px rgba(30,40,80,.30), 0 14px 34px rgba(30,40,80,.16), 0 0 0 1px rgba(0,0,0,.10); }
  .bar { height: 40px; background: linear-gradient(#2a2a2e, #1f1f22); display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(0,0,0,.5); }
  .bar.l { background: linear-gradient(#ececf0, #dcdce1); border-color: rgba(0,0,0,.12); }
  .bar i { width: 12.5px; height: 12.5px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
  .bar .url { margin: 0 auto; width: 44%; height: 26px; border-radius: 8px; background: rgba(255,255,255,.08); color: rgba(235,235,245,.62);
    font-size: 12.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .bar.l .url { background: rgba(255,255,255,.75); color: rgba(60,60,67,.7); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
  .win img { display: block; width: 100%; }

  /* iPhone: titanium frame, Dynamic Island, status bar and home indicator */
  .phone { position: absolute; border-radius: 58px; padding: 12px; background: linear-gradient(145deg, #55555a, #1a1a1d 40%, #38383c);
    box-shadow: 0 60px 120px rgba(0,0,0,.62), 0 20px 40px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.18), inset 0 0 0 4px rgba(0,0,0,.65); }
  .light .phone { box-shadow: 0 50px 100px rgba(30,40,80,.35), 0 14px 30px rgba(30,40,80,.2), inset 0 0 0 1.5px rgba(255,255,255,.25), inset 0 0 0 4px rgba(0,0,0,.65); }
  .phone .scr { position: relative; border-radius: 46px; overflow: hidden; background: #000; }
  .phone .scr img { position: absolute; left: 0; width: 100%; display: block; }
  .phone .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 31%; height: 28px; border-radius: 20px; background: #000; z-index: 3; }
  .phone .home { position: absolute; left: 50%; transform: translateX(-50%); width: 36%; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 3; }
  .title { position: absolute; display: flex; align-items: center; gap: 18px; }
  .logo { width: 74px; height: 74px; border-radius: 20px; background: linear-gradient(145deg, #0a84ff, #5e5ce6); display: grid; place-items: center;
    box-shadow: 0 14px 40px rgba(10,132,255,.45); }
  h1 { font-size: 60px; letter-spacing: -1.6px; font-weight: 800; line-height: 1; }
  .sub { font-size: 22px; opacity: .72; margin-top: 8px; letter-spacing: -.2px; }
  .chips { position: absolute; display: flex; gap: 10px; flex-wrap: wrap; width: 1300px; }
  .chip { font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: 30px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); }
  .light .chip { background: rgba(255,255,255,.7); border-color: rgba(0,0,0,.06); }
  .cap { position: absolute; font-size: 34px; font-weight: 750; letter-spacing: -.8px; }
  .cap small { display: block; font-size: 18px; font-weight: 500; opacity: .65; letter-spacing: -.1px; margin-top: 6px; }
  .pcap { position: absolute; text-align: center; font-size: 19px; font-weight: 650; opacity: .9; }
</style></head>
<body><div id="s" class="stage"><div class="grid"></div></div>
<script>
const RAW = '../raw/';
const LOGO = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M5 2h14v20H5zM5 7h14M5 12h14M5 17h14"/><path d="M8 4.5h.01M8 9.5h.01M8 14.5h.01M8 19.5h.01" stroke="#30d158" stroke-width="2.6"/></svg>';
const s = document.getElementById('s');
const add = h => { s.insertAdjacentHTML('beforeend', h); };
function win(img, x, y, w, light, url) {
  add(`<div class="win" style="left:${x}px;top:${y}px;width:${w}px"><div class="bar ${light ? 'l' : ''}"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <div class="url">🔒 ${url || 'racklive.local'}</div><span style="width:52px"></span></div><img src="${RAW + img}"></div>`);
}
// phone: img is a 390x794 shot (780x1588 px); a 50px status bar goes above it, so the screen is 390x844 like a real iPhone
function phone(img, x, y, w) {
  const k = (w - 24) / 390, SB = 50 * k;
  const status = `<div style="position:absolute;top:0;left:0;right:0;height:${SB}px;background:#000;display:flex;align-items:center;justify-content:space-between;
      padding:${8 * k}px ${32 * k}px 0;font-weight:600;font-size:${16 * k}px;color:#fff;z-index:2">
      <span>9:41</span><span style="display:flex;gap:${5 * k}px;align-items:center">
      <svg width="${18 * k}" height="${12 * k}" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#fff"/></svg>
      <svg width="${17 * k}" height="${12 * k}" viewBox="0 0 16 11"><path d="M8 10.5l2.2-2.6a3.3 3.3 0 0 0-4.4 0zM3.3 5.6a7 7 0 0 1 9.4 0l1.4-1.6a9.2 9.2 0 0 0-12.2 0zM.4 2.6a11.2 11.2 0 0 1 15.2 0" fill="#fff" stroke="#fff" stroke-width=".6"/></svg>
      <span style="width:${26 * k}px;height:${12.5 * k}px;border:${1.2 * k}px solid rgba(255,255,255,.5);border-radius:${4 * k}px;padding:${1.5 * k}px;display:inline-block">
      <span style="display:block;height:100%;width:80%;background:#fff;border-radius:${2 * k}px"></span></span></span></div>`;
  add(`<div class="phone" style="left:${x}px;top:${y}px;width:${w}px"><div class="scr" style="width:${w - 24}px;height:${844 * k}px">${status}
    <img src="${RAW + img}" style="top:${SB}px"><div class="island"></div><div class="home" style="bottom:${7 * k}px"></div></div></div>`);
}
// card: a cropped region of a raw shot (coordinates in raw image pixels) floating on the stage
function card(img, x, y, w, sx, sy, sw, sh, rawW) {
  const k = w / sw;
  add(`<div class="win" style="left:${x}px;top:${y}px;width:${w}px;height:${sh * k}px;border-radius:22px;background:#1c1c1e url(${RAW + img}) no-repeat;
    background-size:${rawW * k}px auto;background-position:${-sx * k}px ${-sy * k}px"></div>`);
}
function title(x, y, size) {
  add(`<div class="title" style="left:${x}px;top:${y}px"><div class="logo">${LOGO}</div><div><h1 style="font-size:${size || 60}px">Rack Live</h1>
    <div class="sub">Серверный шкаф и карта сети с живыми данными</div></div></div>`);
}
function chips(x, y, list) { add(`<div class="chips" style="left:${x}px;top:${y}px">${list.map(c => `<span class="chip">${c}</span>`).join('')}</div>`); }
function cap(x, y, t, sub) { add(`<div class="cap" style="left:${x}px;top:${y}px">${t}${sub ? `<small>${sub}</small>` : ''}</div>`); }

const v = location.hash.slice(1);
// one 1440x900 shot in a window: 1420 px wide → 887 px tall (+40 bar), starts at y=180
const one = (t, sub, img) => { cap(90, 60, t, sub); win(img, 90, 180, 1420); };
if (v === 'hero') {
  title(90, 70);
  chips(90, 190, ['Keenetic', 'TP-Link', 'Proxmox', 'Synology', 'Home Assistant', 'OpenWrt', 'SNMP', 'Frank · ИИ-помощник', 'Docker', 'PWA']);
  win('home_dark.png', 360, 300, 1150);
  phone('m_home.png', 110, 330, 340);
} else if (v === 'home') {
  one('Главная из виджетов', 'Шкаф, состояние сети, интернет, доступность и советы Frank — двигайте и меняйте размер как на iPhone', 'home_dark.png');
} else if (v === 'map') {
  one('Карта сети', 'Строится сама: кабели от портов, PoE, VLAN, Wi-Fi-клиенты у своих точек, интернет через ONT', 'map_dark.png');
} else if (v === 'ports') {
  one('Порты и трафик', 'Лицевая панель коммутатора, PoE в ваттах, VLAN, ошибки CRC, защита от петель, патч-панель', 'ports_dark.png');
} else if (v === 'loop') {
  one('Защита от петель', 'Rack Live замечает петлю по шторму кадров и сам включает защиту коммутатора — по вашей кнопке', 'loop_dark.png');
} else if (v === 'health') {
  one('Состояние сети', 'Тип топологии, точки отказа, безопасность, проверка кабеля — и что исправить в первую очередь', 'health_dark.png');
} else if (v === 'vpn') {
  one('VPN · туннели и клиенты', 'WireGuard, OpenVPN, L2TP: какие туннели подняты, кто подключён, трафик и последнее рукопожатие', 'vpn_dark.png');
} else if (v === 'light') {
  s.classList.add('light');
  cap(90, 60, 'Светлая тема', 'Тёмная и светлая — автоматически по системе, переключается в одно касание');
  win('home_light.png', 90, 190, 900, true);
  win('map_light.png', 610, 330, 900, true);
} else if (v === 'mobile') {
  cap(90, 60, 'На телефоне — как приложение', 'PWA: добавьте на экран «Домой». Виджеты, карта, настройки в стиле iOS, жесты и плавающий док');
  [['m_home.png', 'Главная'], ['m_ports.png', 'Порты коммутатора'], ['m_settings.png', 'Настройки']].forEach(([f, t], i) => {
    phone(f, 230 + i * 400, 190, 340); add(`<div class="pcap" style="left:${230 + i * 400}px;top:925px;width:340px">${t}</div>`); });
}
</script></body></html>
