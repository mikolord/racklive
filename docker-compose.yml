services:
  racklive:
    build: .
    image: racklive:2
    container_name: racklive
    restart: unless-stopped
    # host network: Rack Live sees the real address of each phone/PC (the speed test then knows which
    # Wi-Fi access point you are on) and needs no port mapping. Open http://<server>:8080
    network_mode: host
    # Docker Desktop (Windows / macOS) without host networking: remove network_mode above and use
    # ports:
    #   - "8080:8080"
    volumes:
      - ./data:/data         # settings, devices, history — back this folder up
    environment:
      - RL_PORT=8080         # change if 8080 is taken on the server
      - TZ=Europe/Moscow
