<script>

// CORE-START

const PORT_RU = { rj45: 'RJ-45', sfp: 'SFP', usb: 'USB', power: 'Питание', console: 'Консоль', other: 'Другое' };

function nextN(spots) { const used = new Set(spots.map(s => s.n)); let n = 1; while (used.has(n)) n++; return n; }
/* оставляет порты внутри кадра и в допустимых размерах */
function fitSpot(s) { const w = clamp(s.w, .002, .6), h = clamp(s.h, .002, .6); return { ...s, w: r4(w), h: r4(h), x: r4(clamp(s.x, w / 2, 1 - w / 2)), y: r4(clamp(s.y, h / 2, 1 - h / 2)) }; }
/* ряд одинаковых портов: копии выбранного вправо с шагом step (доля ширины фото), нумерация продолжается */
function repeatSpots(spots, base, count, step, gap) {
  const out = []; let n = nextN(spots.concat(out));
  for (let i = 1; i <= count; i++) {
    const s = { ...base, n: 0, x: base.x + step * i, label: '' };
    if (s.x + s.w / 2 > 1 || spots.length + out.length >= LIMITS.maxSpots) break;
    s.n = n; out.push(fitSpot(s)); n = nextN(spots.concat(out));

  return out;
}
/* нумерация: 'rows' — по строкам слева направо; 'cols' — по колонкам, в колонке сверху вниз (нечётные сверху — как на коммутаторах) */
function renumber(spots, mode) {
  if (!spots.length) return spots;
  const hs = spots.map(s => s.h).sort((a, b) => a - b), tol = hs[Math.floor(hs.length / 2)] * .6;
  const ys = spots.map(s => s.y).sort((a, b) => a - b), rows = []; ys.forEach(y => { if (!rows.length || y - rows[rows.length - 1] > tol) rows.push(y); });
  const rowOf = s => rows.reduce((b, y, i) => Math.abs(y - s.y) < Math.abs(rows[b] - s.y) ? i : b, 0);
  const order = spots.map(s => ({ s, r: rowOf(s) })).sort(mode === 'cols' ? (a, b) => a.s.x - b.s.x || a.r - b.r : (a, b) => a.r - b.r || a.s.x - b.s.x);

    const w = spots.map(s => s.w).sort((a, b) => a - b)[Math.floor(spots.length / 2)], cols = [];
    order.sort((a, b) => a.s.x - b.s.x).forEach(o => { const c = cols[cols.length - 1]; if (c && Math.abs(o.s.x - c.x) < w * .6) c.items.push(o); else cols.push({ x: o.s.x, items: [o] }); });

  const num = new Map(); order.forEach((o, i) => num.set(o.s, i + 1));

/* ответ нейросети: JSON с долями в ПРОЦЕНТАХ (0…100). Принимает JSON внутри текста и ```-блока */
function parseAI(text) {
  let t = String(text || '').trim(); const m = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (m) t = m[1];
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a < 0 || b < a) throw new Error('в ответе нет JSON');
  let o; try { o = JSON.parse(t.slice(a, b + 1)); } catch (e) { throw new Error('не удалось разобрать JSON: ' + e.message); }
  const spots = [], seen = new Set();
  for (const p of (o.spots || o.ports || [])) {
    const n = parseInt(p.n, 10), v = k => Number(p[k]) / 100;
    if (!(n >= 1 && n <= 256) || seen.has(n) || [v('x'), v('y'), v('w'), v('h')].some(x => !isFinite(x))) continue;
    seen.add(n); spots.push(fitSpot({ n, x: v('x'), y: v('y'), w: v('w'), h: v('h'), kind: PORT_KINDS.includes(p.kind) ? p.kind : 'rj45', label: String(p.label || '').slice(0, 24) }));

}
function fitZoom(z) { const w = clamp(z.w, .02, 1), h = clamp(z.h, .02, 1); return { x: r4(clamp(z.x, 0, 1 - w)), y: r4(clamp(z.y, 0, 1 - h)), w: r4(w), h: r4(h) }; }
/* то же приближение, что в Rack Live (PhotoPorts): масштаб и сдвиг в процентах размера фото */
function zoomTransform(z) { const Z = clamp(Math.min(1 / z.w, 1 / z.h), 1, 6); return `scale(${Z}) translate(${(.5 - z.x - z.w / 2) * 100}%, ${(.5 - z.y - z.h / 2) * 100}%)`; }
function buildModel(st) {
  const id = modelId(st.vendor, st.model), vendor = slugify(st.vendor) || 'other';
  const m = { format: 'racklive-card', version: 1, id, vendor: st.vendor.trim(), model: st.model.trim(), kind: st.kind };
  if (st.title.trim()) m.title = st.title.trim();
  if (st.notes.trim()) m.notes = st.notes.trim();
  if (st.photoFile) m.photo = { file: st.photoFile, license: st.license, author: st.author.trim(), source: st.source.trim() };
  if (st.photoFile && st.spots.length) m.spots = st.spots.slice().sort((a, b) => a.n - b.n).map(s => { const o = { n: s.n, x: r4(s.x), y: r4(s.y), w: r4(s.w), h: r4(s.h) }; if (s.kind && s.kind !== 'rj45') o.kind = s.kind; if (s.label) o.label = s.label; return o; });
  if (st.photoFile && st.zoom) m.pzoom = fitZoom(st.zoom);

/* проверка того, что можно проверить в браузере (полная — в каталоге, tools/validate.py) → [{level:'ok'|'bad'|'warn', text}] */
function checkState(st, px) {
  const r = [], add = (level, text) => r.push({ level, text });
  if (!st.photoFile && !st.model3d) add('bad', 'Нужно фото устройства или 3D-модель');
  if (!st.vendor.trim()) add('bad', 'Укажите производителя'); if (!st.model.trim()) add('bad', 'Укажите модель');
  if (st.vendor.trim() && st.model.trim()) add('ok', 'Название: ' + modelId(st.vendor, st.model));
  if (st.photoFile) {
    if (px) {
      add(px.longSide >= LIMITS.minSide && px.longSide <= LIMITS.maxSide ? 'ok' : 'bad', `Размер фото ${px.w}×${px.h} (длинная сторона ${LIMITS.minSide}–${LIMITS.maxSide})`);
      add(px.bytes <= LIMITS.maxBytes ? 'ok' : 'bad', `Файл ${Math.round(px.bytes / 1024)} КБ (не больше ${LIMITS.maxBytes / 1024})`);
      add(px.borderClear >= .97 ? 'ok' : 'bad', `Прозрачный фон: у краёв ${Math.round(px.borderClear * 100)}% (нужно 97%+)`);
    }
    if (!LICENSES[st.license]) add('bad', 'Выберите, чьё это фото и по какой лицензии');
    else if (st.license !== 'own' && !st.source.trim()) add('bad', 'Укажите источник фото (адрес страницы или описание разрешения)');
    else if (/^CC-BY/.test(st.license) && !st.author.trim()) add('bad', 'Для этой лицензии нужен автор фото');
    else add('ok', 'Лицензия: ' + LICENSES[st.license]);
    if (st.source.trim() && st.license !== 'permission' && !/^https:\/\/\S+$/.test(st.source.trim())) add('bad', 'Источник должен начинаться с https://');
    if (!st.rights) add('bad', 'Подтвердите права на фото (галочка внизу)');
    add(st.spots.length ? 'ok' : 'warn', st.spots.length ? `Портов отмечено: ${st.spots.length}` : 'Порты не отмечены — модель будет только картинкой');
    add(st.zoom ? 'ok' : 'warn', st.zoom ? 'Зона приближения задана' : 'Зона приближения не задана — приближаться будет весь блок портов');

/* ZIP без сжатия (store) — чтобы не тащить библиотеки */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    parts.push(lh, name, f.data);
    cen.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(n), ...u32(n), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), name);
    off += lh.length + name.length + n;
  }
  const csize = cen.reduce((a, b) => a + b.length, 0);
  const end = new Uint8Array([0x50, 0x4b, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(off), ...u16(0)]);

const AI_PROMPT = `Ты помогаешь разметить порты на фото сетевого устройства для программы Rack Live.
К сообщению приложено фото устройства (вид спереди или сзади) на прозрачном или светлом фоне.
Верни ТОЛЬКО JSON, без пояснений, в таком виде:
{
  "spots": [ {"n": 1, "x": 12.5, "y": 40.2, "w": 3.1, "h": 9.0, "kind": "rj45", "label": ""} ],
  "zoom": {"x": 8.0, "y": 30.0, "w": 60.0, "h": 40.0}
}
Правила:
- Все числа — ПРОЦЕНТЫ от ширины (x, w) и высоты (y, h) всей картинки, от 0 до 100.
- x, y — центр порта; w, h — его ширина и высота.
- n — номер порта так, как он напечатан на корпусе. Если номеров не видно — нумеруй слева направо, по строкам.
- kind: rj45, sfp, usb, power, console или other. label — короткая подпись (WAN, PoE), если есть.
- Отмечай только настоящие разъёмы для кабелей: не светодиоды, не винты, не решётки.
- zoom — прямоугольник (x, y — ЛЕВЫЙ ВЕРХНИЙ угол), в который целиком помещаются все порты с небольшим запасом.

    <ul class="chk">${res.map(r => `<li class="${r.level}">${esc(r.text)}</li>`).join('')}</ul>
    ${S.work ? `<label class="f"><span><input type="checkbox" id="rights" ${S.rights ? 'checked' : ''}> Это моё фото, или у меня есть право его использовать и публиковать под указанной лицензией</span></label>` : ''}
    <div class="row"><button class="btn pri" id="pub" ${bad || S.busy ? 'disabled' : ''}>${S.busy ? 'Публикую…' : 'Опубликовать в магазин'}</button><button class="btn" id="dl" ${bad ? 'disabled' : ''}>Скачать .zip</button></div>
    ${S.pubMsg ? `<p class="${S.pubOk ? 'okmsg' : 'errmsg'}">${esc(S.pubMsg)}</p>` : ''}
    <p class="note">Модель сразу попадёт в общий каталог (нужен токен GitHub: Rack Live → Магазин → Модерация). В списке магазина она появится через минуту-две.</p>
    <div class="row"><button class="btn" data-go="3">← Описание</button></div></div>`;
}
function selPanel() {
  const s = S.spots.find(q => q.n === S.sel); if (!s) return '<p class="note">Выберите порт в списке или на фото, чтобы изменить его.</p>';
  return `<div class="card" style="margin:8px 0;padding:10px"><div class="row" style="margin:0"><b>Порт ${s.n}</b>
    <input id="sn" type="number" min="1" max="256" value="${s.n}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
    <select id="sk">${opts(PORT_RU, s.kind)}</select><input id="sl" placeholder="подпись (WAN…)" maxlength="24" value="${esc(s.label || '')}" style="flex:1;min-width:90px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
    <button class="btn bad" id="sd">Удалить</button></div>
    <div class="row" style="margin-bottom:0">Ряд: <input id="rc" type="number" min="1" max="48" value="7" style="width:60px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"> копий вправо с шагом
    <input id="rs" type="number" min="0.5" max="40" step="0.1" value="${(s.w * 115).toFixed(1)}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"> % <button class="btn" id="rep">Размножить</button></div></div>`;
}
const b64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
async function publish() {
  S.busy = true; S.pubMsg = ''; render(true);
  try {
    const b = buildModel(S), m = b.model;
    const body = { vendor: S.vendor.trim(), model: S.model.trim(), kind: S.kind0, title: S.title.trim(), notes: S.notes.trim(), vendor_dir: b.vendor, id: b.id,
      license: S.license, author: S.author.trim(), source: S.source.trim(), spots: m.spots || [], pzoom: m.pzoom || null, model3d: S.model3d || null };
    if (S.photoBlob) body.photo = await b64(S.photoBlob);
    const r = await fetch('/api/models/store/publish', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) throw new Error('Нужно войти в Rack Live: откройте его в этом же браузере, войдите и вернитесь сюда.');
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.error || 'не получилось опубликовать (ответ ' + r.status + ')');
    S.pubOk = true; S.pubMsg = 'Опубликовано: ' + j.id + '. В магазине появится через минуту-две.';
  } catch (e) { S.pubOk = false; S.pubMsg = e.message; }
  S.busy = false; render(true);
}

/* --- сборка и события --- */
function render(keepFocus) {
  $('tabs').innerHTML = TABS.map((n, i) => `<button class="tab${i === S.tab ? ' on' : ''}" data-t="${i}" ${i > 0 && !S.work ? 'disabled' : ''}>${n}</button>`).join('');
  const act = keepFocus && document.activeElement && document.activeElement.id; const val = act && document.activeElement.value;
  $('side').innerHTML = panel(); paintOverlay();
  $('hint').textContent = !S.work ? 'Загрузите фото, чтобы начать.' : S.tab === 2 ? 'Обведите прямоугольник приближения.' : S.tab === 1 ? 'Коснитесь порта и ведите палец — метка встанет там, где отпустите.' : '';
  if (act && $(act) && 'value' in $(act) && $(act).type !== 'file') { $(act).focus(); try { $(act).setSelectionRange(val.length, val.length); } catch (e) { } }
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-t],[data-go],[data-pick],button,a'); if (!t) return;
  if (t.dataset.t != null) { S.tab = +t.dataset.t; S.previewZoom = false; return render(); }
  if (t.dataset.go != null) { S.tab = +t.dataset.go; S.previewZoom = false; return render(); }
  if (t.dataset.pick != null) { S.sel = +t.dataset.pick; return render(); }
  const id = t.id;
  if (id === 'sd') { S.spots = S.spots.filter(q => q.n !== S.sel); S.sel = null; render(); }
  else if (id === 'rn1' || id === 'rn2') { const old = S.spots.find(q => q.n === S.sel); S.spots = renumber(S.spots, id === 'rn1' ? 'rows' : 'cols'); S.sel = old ? S.spots[S.spots.findIndex(q => q.x === old.x && q.y === old.y)].n : null; render(); }
  else if (id === 'rep') { const s = S.spots.find(q => q.n === S.sel); if (s) { S.spots.push(...repeatSpots(S.spots, s, clamp(+$('rc').value | 0, 1, 48), clamp(+$('rs').value || s.w * 115, .5, 40) / 100)); render(); } }
  else if (id === 'pv') { S.previewZoom = !S.previewZoom; render(); }
  else if (id === 'zauto') { if (S.spots.length) { const x0 = Math.min(...S.spots.map(s => s.x - s.w / 2)), y0 = Math.min(...S.spots.map(s => s.y - s.h / 2)), x1 = Math.max(...S.spots.map(s => s.x + s.w / 2)), y1 = Math.max(...S.spots.map(s => s.y + s.h / 2)), m = .03; S.zoom = fitZoom({ x: x0 - m, y: y0 - m, w: x1 - x0 + 2 * m, h: y1 - y0 + 2 * m }); render(); } }
  else if (id === 'zdel') { S.zoom = null; S.previewZoom = false; render(); }
  else if (id === 'del3d') { S.model3d = null; render(); }
  else if (id === 'ai') aiPanel();
  else if (id === 'aicopy') { navigator.clipboard.writeText(AI_PROMPT).then(() => { t.textContent = 'Скопировано ✓'; }, () => { $('aiprompt').select && $('aiprompt').select(); }); }
  else if (id === 'aiapply') { try { const r = parseAI($('aitext').value); S.spots = r.spots; if (r.zoom) S.zoom = r.zoom; S.sel = null; $('aimsg').textContent = `Добавлено портов: ${r.spots.length}. Проверьте и поправьте рамки.`; render(); } catch (e) { $('aimsg').textContent = e.message; } }
  else if (id === 'dl') download();
  else if (id === 'pub') publish();
});
document.addEventListener('input', ev => {
  const t = ev.target, id = t.id;
  if (id === 'file' && t.files[0]) { S.msg = ''; loadFile(t.files[0]); }
  else if (id === 'bgOn') { S.bgOn = t.checked; S.spots = []; S.zoom = null; process(); render(); }
  else if (id === 'crop') { S.crop = t.checked; S.spots = []; S.zoom = null; process(); render(); }
  else if (id === 'tol') { S.bgTol = +t.value; clearTimeout(S._tt); S._tt = setTimeout(() => { S.spots = []; S.zoom = null; process(); }, 150); }
  else if (id === 'pk') S.kind = t.value;
  else if (id === 'psz') { S.size = +t.value; $('pszv').textContent = S.size; const k = S.work.width / S.work.height; S.spots = S.spots.map(s => fitSpot({ ...s, w: S.size / 100, h: S.size / 100 * k })); paintOverlay(); }
  else if (id === 'sk') { const s = S.spots.find(q => q.n === S.sel); if (s) { s.kind = t.value; render(true); } }
  else if (id === 'sl') { const s = S.spots.find(q => q.n === S.sel); if (s) s.label = t.value; }
  else if (id === 'sn') { const s = S.spots.find(q => q.n === S.sel), n = +t.value | 0; if (s && n >= 1 && n <= 256 && !S.spots.some(q => q.n === n)) { s.n = n; S.sel = n; } }
  else if (['vendor', 'model', 'title', 'notes', 'author', 'source'].includes(id)) S[id] = t.value;
  else if (id === 'kind0') S.kind0 = t.value; else if (id === 'lic') { S.license = t.value; render(); }
  else if (id === 'rights') S.rights = t.checked;
  else if (id === 'f3d' && t.files[0]) { t.files[0].text().then(tx => { try { const o = JSON.parse(tx); if (o.format !== 'racklive-model') throw 0; if (tx.length > 300000) throw 0; S.model3d = tx; } catch (e) { S.msg = 'Это не файл racklive-model или он слишком большой'; } render(); }); }
  if (S.tab === 4) { clearTimeout(S._ck); S._ck = setTimeout(() => render(true), 0); }
});
function aiPanel() {
  const b = $('aibox'); b.classList.toggle('hidden'); if (b.dataset.on) return; b.dataset.on = 1;
  b.innerHTML = `<div class="card" style="margin:8px 0"><h2>Разметка с помощью ИИ</h2><ol class="note"><li>Скопируйте инструкцию.</li><li>Отправьте её вместе с фото в любой ИИ-чат (Claude, ChatGPT, Gemini…).</li><li>Вставьте ответ сюда и нажмите «Применить».</li></ol>
  <div class="row"><button class="btn" id="aicopy">Скопировать инструкцию</button></div><textarea id="aiprompt" class="hidden"></textarea>
  <label class="f">Ответ ИИ<textarea id="aitext" rows="5" placeholder='{"spots": [...], "zoom": {...}}'></textarea></label>
  <div class="row"><button class="btn pri" id="aiapply">Применить</button></div><p class="note" id="aimsg">ИИ ошибается в положении портов — после применения проверьте рамки и поправьте.</p></div>`;
}
async function download() {
  const b = buildModel(S), files = [{ name: `${b.dir}/model.json`, data: new TextEncoder().encode(JSON.stringify(b.model, null, 1)) }];
  if (S.photoBlob) files.push({ name: `${b.dir}/${S.photoFile}`, data: new Uint8Array(await S.photoBlob.arrayBuffer()) });
  if (S.model3d) files.push({ name: `${b.dir}/model3d.json`, data: new TextEncoder().encode(S.model3d) });
  const url = URL.createObjectURL(new Blob([makeZip(files)], { type: 'application/zip' })), a = document.createElement('a');
  a.href = url; a.download = b.id + '.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
window.__ed = { S, process, render, loadFile, buildModel, checkState };       // для автотестов
render();
</script>
</body>
