<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- opaque status bar: in portrait iOS blurs whatever sits under a translucent status bar (incl. our header) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rack Live">
  <title>Rack Live</title>
  <link rel="icon" href="icon.svg?v=28" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=28">
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="stylesheet" href="styles.css?v=2.43.7">
  <script>
  // phones and the installed app behave like an app: no page zoom (pinch, double tap), no text selection / «Copy» bubble while dragging.
  // The map and the plan zoom with their own gestures.
  (function(){if(!(matchMedia('(pointer: coarse)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone))return;
   document.documentElement.classList.add('app-touch');
   var no=function(e){e.preventDefault()},o={passive:false};
   ['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(t){document.addEventListener(t,no,o)});
   var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!e.target.closest('textarea,input,select,button,a,[role=button]'))e.preventDefault();last=n},o);})();
  try{var q=(location.search.match(/theme=(light|dark)/)||[])[1];if(q)localStorage.setItem('rl_theme',q);var t=localStorage.getItem('rl_theme')||'auto',r=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.setAttribute('data-theme',r);var qs=(location.search.match(/skin=(classic|graphite|net|test)/)||[])[1],qa=(location.search.match(/accent=(\w+)/)||[])[1];if(qs){localStorage.setItem('rl_skin',qs);localStorage.setItem('rl_theme_meta','');}if(qa)localStorage.setItem('rl_accent',qa==='none'?'':qa);try{if(!localStorage.getItem('rl_look2')){localStorage.setItem('rl_look2','1');if(!localStorage.getItem('rl_skin')||localStorage.getItem('rl_skin')==='net')localStorage.setItem('rl_skin','test');}}catch(e){}var sk=localStorage.getItem('rl_skin')||'test',ac=localStorage.getItem('rl_accent'),H=document.documentElement;if(sk==='graphite'){H.setAttribute('data-skin','graphite');}else if(sk==='net'||sk==='test'){H.setAttribute('data-skin','net');if(sk==='test'){H.setAttribute('data-look','test');}}else if(sk&&sk!=='classic'){var mt=null;try{mt=JSON.parse(localStorage.getItem('rl_theme_meta')||'null')}catch(e){}if(mt&&mt.id===sk&&/^[a-z][a-z0-9-]{2,31}$/.test(sk)){if(mt.base==='graphite')H.setAttribute('data-skin','graphite');H.setAttribute('data-theme-id',sk);document.write('<link rel="stylesheet" id="rl-theme-css" href="/themes/'+sk+'/theme.css?v='+(mt.rev||0)+'">');}else{localStorage.setItem('rl_skin','classic')}}if(ac)H.setAttribute('data-accent',ac);if(localStorage.getItem('rl_glass')==='0')H.setAttribute('data-glass','off');
  if(t!=='auto'){document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.removeAttribute('media');m.setAttribute('content',r==='dark'?'#000000':'#f2f2f7')})}}catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="app.js?v=2.43.7"></script>
</body>
</html>
