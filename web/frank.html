<!DOCTYPE html>
<html lang="ru" data-theme="dark" class="frank-mode">
<head>
  <meta charset="UTF-8">
  <!-- an app, not a page: no zoom. Status bar «default» painted with theme-color = page background, so it blends in.
       NOT black-translucent: on iOS 26 it blurs everything under/near the status bar and cuts the viewport short at the bottom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Frank">
  <title>Frank</title>
  <link rel="icon" href="/frank-icon.svg?v=27" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/frank-apple-touch-icon.png?v=27">
  <link rel="manifest" href="/frank-manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <!-- the same app bundle as Rack Live, started in «Frank only» mode -->
  <script>window.RL_APP = 'frank';
  // Android / desktop Chrome: keep the install prompt for our own «Установить» button
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__bip = e; window.dispatchEvent(new Event('rl-bip')); });
  // Safari ignores user-scalable=no in places: block pinch (gesture* events, two-finger moves) and double-tap zoom by hand
  (function(){var no=function(e){e.preventDefault()},o={passive:false};
   ['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(t){document.addEventListener(t,no,o)});
   document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},o);
   var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!e.target.closest('textarea,input,button,a,[role=button]'))e.preventDefault();last=n},o);})();
  try{var q=(location.search.match(/theme=(light|dark)/)||[])[1];if(q)localStorage.setItem('rl_theme',q);var t=localStorage.getItem('rl_theme')||'auto',r=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.setAttribute('data-theme',r);var sk=localStorage.getItem('rl_skin'),ac=localStorage.getItem('rl_accent');if(sk&&sk!=='classic')document.documentElement.setAttribute('data-skin',sk);if(ac)document.documentElement.setAttribute('data-accent',ac);
  if(t!=='auto'){document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.removeAttribute('media');m.setAttribute('content',r==='dark'?'#000000':'#f2f2f7')})}}catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
